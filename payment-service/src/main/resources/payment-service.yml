# payment-service. Defaults target dev mode: infra from `make up`, this service via ./mvnw spring-boot:run.
# Containers (Phase 5) override DB_HOST and KAFKA_BOOTSTRAP. The password default matches the
# dev-only default in compose.yaml. Override it through the environment, never commit a real one.
server:
  port: 8082

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/payment_db
    username: payment_svc
    password: ${PAYMENT_DB_PASSWORD:payment_svc}
  flyway:
    # Service-specific folder: three services' migrations can share one classpath (e2e tests).
    locations: classpath:db/migration/payment
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: payment-service
      # Offsets are committed only after the DB transaction commits (ADR-0005).
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      # One record at a time. The offset is committed after the handler (and its DB transaction) returns.
      ack-mode: record
    producer:
      acks: all
      properties:
        enable.idempotence: true
  jackson:
    # Money must not pass through double (ADR-0011). Exact BigDecimal tree nodes come in Phase 2.
    deserialization:
      use-big-decimal-for-floats: true
    serialization:
      write-dates-as-timestamps: false

# Fake gateway (PaymentProperties): charges above decline-amount-over are declined; fail-rate
# declines a random fraction of charges.
payment:
  decline-amount-over: 1000.00
  fail-rate: 0.0
  # F8 demo: the first N refunds fail transiently (Kafka retries, DLT, then the orchestrator resends).
  refund-fail-times: 0

# naive: dual write, no dedup. reliable (Phase 4): outbox + inbox (ADR-0010).
saga:
  mode: reliable

# Retry + dead-letter policy (KafkaErrorHandling, ADR-0007): blocking retries after 1s, 2s, 4s,
# then <topic>.DLT. Malformed / unknown-type / unsupported-version messages skip the retries.
messaging:
  # Reliable mode only: how often OutboxRelay looks for unpublished rows (ADR-0004).
  outbox:
    poll-interval-ms: 200
  retry:
    initial-interval: 1s
    multiplier: 2.0
    max-retries: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
