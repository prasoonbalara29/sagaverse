# order-service. Defaults target dev mode: infra from `make up`, this service via ./mvnw spring-boot:run.
# Containers (Phase 5) override DB_HOST and KAFKA_BOOTSTRAP. The password default matches the
# dev-only default in compose.yaml. Override it through the environment, never commit a real one.
server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/order_db
    username: order_svc
    password: ${ORDER_DB_PASSWORD:order_svc}
  flyway:
    # Service-specific folder: three services' migrations can share one classpath (e2e tests).
    locations: classpath:db/migration/order
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: order-service
      # Offsets are committed only after the DB transaction commits (ADR-0005).
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      # One record at a time. The offset is committed after the handler (and its DB transaction) returns.
      ack-mode: record
    producer:
      acks: all
      properties:
        enable.idempotence: true
  jackson:
    # Money must not pass through double (ADR-0011). Exact BigDecimal tree nodes come in Phase 2.
    deserialization:
      use-big-decimal-for-floats: true
    serialization:
      write-dates-as-timestamps: false

# Saga tuning (SagaProperties, ADR-0009/0010). Phase 2 runs in naive mode only.
saga:
  mode: naive
  step-timeout: 10s
  max-step-attempts: 6
  max-compensation-attempts: 10
  sweep-interval: 2s

# Retry + dead-letter policy (KafkaErrorHandling, ADR-0007): blocking retries after 1s, 2s, 4s,
# then <topic>.DLT. Malformed / unknown-type / unsupported-version messages skip the retries.
messaging:
  retry:
    initial-interval: 1s
    multiplier: 2.0
    max-retries: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
