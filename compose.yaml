# Local runtime for sagaverse (Podman). See ADR-0011.
# Images come from the internal Docker Hub mirror docker.intuit.com/docker-rmt (docker.io is blocked).
#
#   make up        infra only (postgres, kafka, topics-init), for dev mode with ./mvnw spring-boot:run
#   make up-all    infra + the three services as containers (added in Phase 5)
#
# Credentials here are dev-only defaults. Override them through the environment or an untracked .env file.
name: sagaverse

services:
  postgres:
    image: docker.intuit.com/docker-rmt/library/postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-order_svc}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_svc}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_svc}
    volumes:
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro,Z
    ports:
      - "5432:5432"
    healthcheck:
      # Over TCP on purpose: during init the temporary server listens on the unix socket only.
      # inventory_db is created last, so this passes only after the init script has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d inventory_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 256m

  kafka:
    image: docker.intuit.com/docker-rmt/apache/kafka:3.9.2
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # PLAINTEXT is for containers (kafka:9092). HOST is for apps on your Mac (localhost:9092).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    ports:
      - "9092:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 768m

  topics-init:
    image: docker.intuit.com/docker-rmt/apache/kafka:3.9.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:9092
      KAFKA_HEAP_OPTS: "-Xmx128m"
    volumes:
      - ./infra/kafka:/scripts:ro,Z
    restart: "no"
    mem_limit: 256m

